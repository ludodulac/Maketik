name: Verify Maketik visual plan

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/visual-plan.mjs'
      - 'app/api/generate-visual-plan/**'
      - '.github/workflows/visual-plan.yml'

jobs:
  visual-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Start production server
        run: |
          npm start > /tmp/maketik-visual.log 2>&1 &
          for i in {1..30}; do
            if curl --silent --fail http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/maketik-visual.log
          exit 1
      - name: Reject an unvalidated visual plan request
        run: |
          STATUS=$(curl --silent --show-error --max-time 10 \
            -o /tmp/visual-rejected.json \
            -w '%{http_code}' \
            -X POST http://127.0.0.1:3000/api/generate-visual-plan \
            -H 'content-type: application/json' \
            --data '{"universe":"Oiseau enquêteur","character":"Bec","script":{"status":"proposed","script":"Texte proposé."}}')
          test "$STATUS" = "409"
          node -e "const d=require('/tmp/visual-rejected.json'); if(d.ok!==false||!d.error) throw new Error('Visual plan rejection is not explicit'); console.log('UNVALIDATED_VISUAL_PLAN_REJECTED')"
      - name: Generate a traceable structural visual plan
        run: |
          cat > /tmp/visual-request.json <<'JSON'
          {
            "universe":"Oiseau enquêteur",
            "character":"Bec",
            "script":{
              "id":"validated-visual-script",
              "status":"validated",
              "title":"Pourquoi les trous noirs comptent",
              "script":"Imagine une région si dense que même la lumière ne peut plus s'en échapper. Certains trous noirs apparaissent après l'effondrement d'étoiles massives. D'autres sont supermassifs et occupent le centre de nombreuses galaxies. Leur masse peut représenter des millions ou des milliards de fois celle du Soleil. Leur gravité influence fortement leur environnement. Leur formation reste encore une question scientifique importante.",
              "sourceFacts":[
                "Un trou noir peut être si dense que même la lumière ne peut pas s'en échapper.",
                "Certains trous noirs de masse stellaire se forment après l'effondrement d'étoiles massives.",
                "Les trous noirs supermassifs se trouvent au centre de nombreuses galaxies.",
                "Leur masse peut atteindre des millions ou des milliards de fois celle du Soleil.",
                "Ces objets influencent leur environnement gravitationnel.",
                "La formation précise des trous noirs supermassifs reste une question scientifique importante."
              ]
            }
          }
          JSON
          STATUS=$(curl --silent --show-error --max-time 10 \
            -o /tmp/visual-plan.json \
            -w '%{http_code}' \
            -X POST http://127.0.0.1:3000/api/generate-visual-plan \
            -H 'content-type: application/json' \
            --data-binary @/tmp/visual-request.json)
          test "$STATUS" = "200"
          node - <<'NODE'
          const data=require('/tmp/visual-plan.json');
          if(!data.ok||data.mode!=='structural-fallback'||data.provider!=='local-visual-planner') throw new Error('Visual plan truth metadata is missing');
          if(data.scriptId!=='validated-visual-script') throw new Error('Visual plan lost its validated script provenance');
          if(!Array.isArray(data.shots)||data.shots.length<4||data.shots.length>8) throw new Error(`Unexpected shot count ${data.shots?.length}`);
          for(const [index,shot] of data.shots.entries()){
            if(shot.order!==index+1||!shot.narrationExcerpt||!shot.visualNeed||!shot.documentaryReference||!shot.continuity||!shot.limitation) throw new Error('A visual shot is incomplete');
            if(!shot.continuity.includes('Bec')||!shot.continuity.includes('Oiseau enquêteur')) throw new Error('Project visual continuity was not preserved');
          }
          if(!data.limitations) throw new Error('Visual-plan limitations must remain explicit');
          console.log(`VISUAL_PLAN_OK shots=${data.shots.length} mode=${data.mode}`);
          NODE
      - name: Show server log on failure
        if: failure()
        run: cat /tmp/maketik-visual.log || true
