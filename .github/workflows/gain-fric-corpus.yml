name: Probe Gain fric real YouTube corpus

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gain-fric-corpus.yml'
      - 'scripts/probe-gain-fric.mjs'
      - 'app/api/transcribe-youtube/route.js'
      - 'lib/youtube-corpus.mjs'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Start Maketik
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3000 >/tmp/maketik.log 2>&1 &
          echo $! >/tmp/maketik.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/maketik.log
          exit 1
      - name: Probe the four real Gain fric sources
        run: node scripts/probe-gain-fric.mjs
      - name: Stop Maketik
        if: always()
        run: kill $(cat /tmp/maketik.pid) 2>/dev/null || true
