name: Verify Maketik documentary search

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/api/search-documentary-references/**'
      - '.github/workflows/documentary-search.yml'

jobs:
  documentary-search:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Start production server
        run: |
          npm start > /tmp/maketik-search.log 2>&1 &
          for i in {1..30}; do
            if curl --silent --fail http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/maketik-search.log
          exit 1
      - name: Reject search when target is not awaiting research
        run: |
          STATUS=$(curl --silent --show-error --max-time 10 \
            -o /tmp/search-rejected.json \
            -w '%{http_code}' \
            -X POST http://127.0.0.1:3000/api/search-documentary-references \
            -H 'content-type: application/json' \
            --data '{"target":{"status":"verified","searchQuery":"black hole"}}')
          test "$STATUS" = "409"
          node -e "const d=require('/tmp/search-rejected.json'); if(d.ok!==false||!d.error) throw new Error('Invalid search target rejection is not explicit'); console.log('NON_RESEARCH_TARGET_REJECTED')"
      - name: Search Wikimedia Commons for real documentary candidates
        run: |
          cat > /tmp/search-request.json <<'JSON'
          {"target":{"status":"needs-research","shotOrder":1,"searchQuery":"black hole galaxy astronomy","sourceFact":"Les trous noirs supermassifs se trouvent au centre de nombreuses galaxies."}}
          JSON
          STATUS=$(curl --silent --show-error --max-time 20 \
            -o /tmp/search-results.json \
            -w '%{http_code}' \
            -X POST http://127.0.0.1:3000/api/search-documentary-references \
            -H 'content-type: application/json' \
            --data-binary @/tmp/search-request.json)
          test "$STATUS" = "200"
          node - <<'NODE'
          const data=require('/tmp/search-results.json');
          if(!data.ok||data.provider!=='wikimedia-commons'||!data.searchedAt) throw new Error('Search provenance is incomplete');
          if(!Array.isArray(data.candidates)||data.candidates.length<1) throw new Error('Real Wikimedia search returned no bitmap documentary candidates');
          for(const candidate of data.candidates){
            if(candidate.verificationStatus!=='candidate-unverified') throw new Error('Search result pretends to be verified');
            if(!candidate.originalUrl||!candidate.pageUrl||!candidate.title||!candidate.sourceTarget?.searchQuery) throw new Error('Candidate provenance is incomplete');
            if(!candidate.limitation||!/validation/i.test(candidate.limitation)) throw new Error('Candidate limitation is missing');
          }
          if(!/candidats non validés/i.test(data.limitations)) throw new Error('Search-level limitation is missing');
          const first=data.candidates[0];
          console.log(`WIKIMEDIA_SEARCH_OK count=${data.candidates.length} first=${first.title} license=${first.license||'unknown'}`);
          NODE
      - name: Show server log on failure
        if: failure()
        run: cat /tmp/maketik-search.log || true
