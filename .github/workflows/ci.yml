name: Verify Maketik

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Start production server
        run: |
          npm start > /tmp/maketik.log 2>&1 &
          echo $! > /tmp/maketik.pid
          for i in {1..30}; do
            if curl --silent --fail http://127.0.0.1:3000/ > /tmp/home.html; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/maketik.log
          exit 1
      - name: Verify application home
        run: |
          grep -q "MAKE" /tmp/home.html
          echo "Homepage served by the production Next.js server."
      - name: Find a factual YouTube source with a real transcript
        run: |
          rm -f /tmp/transcript.json /tmp/inspect.json /tmp/source-url.txt
          candidates=(
            "https://www.youtube.com/watch?v=rb7TVW77ZCs"
            "https://www.youtube.com/watch?v=EJXTZ5jpSmk"
            "https://www.youtube.com/watch?v=aircAruvnKk"
          )
          for url in "${candidates[@]}"; do
            echo "Trying factual source: $url"
            curl --silent --show-error \
              -X POST http://127.0.0.1:3000/api/inspect-source \
              -H 'content-type: application/json' \
              --data "{\"url\":\"$url\"}" \
              > /tmp/candidate-inspect.json
            cat /tmp/candidate-inspect.json
            INSPECT_OK=$(node -e "const d=require('/tmp/candidate-inspect.json');process.stdout.write(d.ok&&d.kind==='youtube'&&d.title?'yes':'no')")
            if [ "$INSPECT_OK" != "yes" ]; then
              echo "Metadata not usable; trying next candidate."
              continue
            fi
            STATUS=$(curl --silent --show-error \
              -o /tmp/candidate-transcript.json \
              -w '%{http_code}' \
              -X POST http://127.0.0.1:3000/api/transcribe-youtube \
              -H 'content-type: application/json' \
              --data "{\"url\":\"$url\"}")
            echo "Transcript HTTP $STATUS"
            cat /tmp/candidate-transcript.json
            TRANSCRIPT_OK=$(STATUS="$STATUS" node -e "const d=require('/tmp/candidate-transcript.json');process.stdout.write(Number(process.env.STATUS)===200&&d.ok&&d.text&&d.wordCount>=200&&d.provider?'yes':'no')")
            if [ "$TRANSCRIPT_OK" = "yes" ]; then
              cp /tmp/candidate-inspect.json /tmp/inspect.json
              cp /tmp/candidate-transcript.json /tmp/transcript.json
              printf '%s' "$url" > /tmp/source-url.txt
              break
            fi
            echo "No usable real transcript; trying next candidate."
          done
          test -s /tmp/transcript.json || { echo "No factual candidate produced a real transcript."; exit 1; }
          node - <<'NODE'
          const fs=require('fs');
          const inspection=JSON.parse(fs.readFileSync('/tmp/inspect.json','utf8'));
          const transcript=JSON.parse(fs.readFileSync('/tmp/transcript.json','utf8'));
          const url=fs.readFileSync('/tmp/source-url.txt','utf8');
          if(inspection.transcript?.status!=='unavailable') throw new Error('Metadata inspection must not pretend to contain a transcript');
          console.log(`FACTUAL_SOURCE_OK ${inspection.title} — ${inspection.author||'unknown'} — ${url}`);
          console.log(`REAL_TRANSCRIPT_OK words=${transcript.wordCount} provider=${transcript.provider}`);
          NODE
      - name: Generate bounded local drafts from the recovered transcript
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const transcript=JSON.parse(fs.readFileSync('/tmp/transcript.json','utf8'));
          const inspection=JSON.parse(fs.readFileSync('/tmp/inspect.json','utf8'));
          fs.writeFileSync('/tmp/generation-request.json',JSON.stringify({
            projectName:'CI factual vertical loop',
            universe:'Oiseau enquêteur',
            character:'Bec',
            references:[],
            transcript:transcript.text,
            sourceTitle:inspection.title
          }));
          NODE
          STATUS=$(curl --silent --show-error \
            -o /tmp/generation.json \
            -w '%{http_code}' \
            -X POST http://127.0.0.1:3000/api/generate-scripts \
            -H 'content-type: application/json' \
            --data-binary @/tmp/generation-request.json)
          echo "HTTP $STATUS"
          cat /tmp/generation.json
          STATUS="$STATUS" node - <<'NODE'
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync('/tmp/generation.json','utf8'));
          const status=Number(process.env.STATUS);
          if(status!==200||!data.ok) throw new Error(`Local generation failed with HTTP ${status}: ${data.error||'unknown error'}`);
          if(data.generationMode!=='fallback'||data.provider!=='local-extractive') throw new Error('Local generation must be explicitly labelled as fallback/extractive');
          if(!Array.isArray(data.scripts)||data.scripts.length<3) throw new Error('Expected at least three real draft artifacts');
          for(const script of data.scripts){
            if(!script.script||!script.hook||!Array.isArray(script.sourceFacts)||script.sourceFacts.length<6) throw new Error('Draft is missing content or source traceability');
            if(script.estimatedSeconds<35||script.estimatedSeconds>75) throw new Error(`Draft duration outside bounded fallback range: ${script.estimatedSeconds}s`);
            for(const fact of script.sourceFacts){
              if(fact.split(/\s+/).filter(Boolean).length>28) throw new Error('A source fact chunk is too large to be a usable traceability unit');
            }
          }
          if(!data.limitations) throw new Error('Fallback limitations must be explicit');
          console.log(`LOCAL_DRAFTS_OK count=${data.scripts.length} model=${data.model}`);
          NODE
      - name: Show server log on failure
        if: failure()
        run: cat /tmp/maketik.log || true
