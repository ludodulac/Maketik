name: Verify Maketik

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Start production server
        run: |
          npm start > /tmp/maketik.log 2>&1 &
          echo $! > /tmp/maketik.pid
          for i in {1..30}; do
            if curl --silent --fail http://127.0.0.1:3000/ > /tmp/home.html; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/maketik.log
          exit 1
      - name: Verify application home
        run: |
          grep -q "MAKE" /tmp/home.html
          echo "Homepage served by the production Next.js server."
      - name: Verify automatic YouTube transcript path with a real source
        run: |
          STATUS=$(curl --silent --show-error \
            -o /tmp/automatic-transcript.json \
            -w '%{http_code}' \
            -X POST http://127.0.0.1:3000/api/transcribe-youtube \
            -H 'content-type: application/json' \
            --data '{"url":"https://www.youtube.com/watch?v=dQw4w9WgXcQ"}')
          STATUS="$STATUS" node - <<'NODE'
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync('/tmp/automatic-transcript.json','utf8'));
          const status=Number(process.env.STATUS);
          if(status!==200||!data.ok||!data.text||!data.provider||data.wordCount<100){
            throw new Error(`Known automatic-caption path failed; HTTP ${status}: ${data.error||'invalid transcript artifact'}`);
          }
          console.log(`AUTOMATIC_TRANSCRIPT_OK words=${data.wordCount} provider=${data.provider}`);
          NODE
      - name: Verify factual source and honest manual fallback
        run: |
          FACTUAL_URL='https://www.youtube.com/watch?v=EJXTZ5jpSmk'
          curl --silent --show-error \
            -X POST http://127.0.0.1:3000/api/inspect-source \
            -H 'content-type: application/json' \
            --data "{\"url\":\"$FACTUAL_URL\"}" \
            > /tmp/factual-inspect.json
          STATUS=$(curl --silent --show-error \
            -o /tmp/factual-transcript-attempt.json \
            -w '%{http_code}' \
            -X POST http://127.0.0.1:3000/api/transcribe-youtube \
            -H 'content-type: application/json' \
            --data "{\"url\":\"$FACTUAL_URL\"}")
          STATUS="$STATUS" node - <<'NODE'
          const fs=require('fs');
          const inspection=JSON.parse(fs.readFileSync('/tmp/factual-inspect.json','utf8'));
          const attempt=JSON.parse(fs.readFileSync('/tmp/factual-transcript-attempt.json','utf8'));
          const status=Number(process.env.STATUS);
          if(!inspection.ok||inspection.kind!=='youtube'||!inspection.title) throw new Error('Factual source metadata was not verified');
          if(inspection.transcript?.status!=='unavailable') throw new Error('Metadata inspection must not pretend to contain a transcript');
          if(status===200&&attempt.ok){
            console.log(`FACTUAL_AUTOMATIC_TRANSCRIPT_OK words=${attempt.wordCount}`);
          }else{
            if(status!==422||attempt.ok!==false||!attempt.fallback) throw new Error(`Factual transcription failure is not explicit; HTTP ${status}`);
            console.log(`FACTUAL_TRANSCRIPT_UNAVAILABLE_HONESTLY ${inspection.title}`);
          }
          NODE
          node - <<'NODE'
          const fs=require('fs');
          const inspection=JSON.parse(fs.readFileSync('/tmp/factual-inspect.json','utf8'));
          const manualText=`Texte fourni manuellement pour le test de secours Maketik, après l’échec explicite de la transcription automatique. Un trou noir est une région extrêmement dense de l’espace dont la gravité est si forte que même la lumière ne peut pas s’en échapper. Certains trous noirs de masse stellaire se forment après l’effondrement d’étoiles massives. Les trous noirs supermassifs sont beaucoup plus lourds et se trouvent au centre de nombreuses galaxies. Leur masse peut atteindre des millions ou des milliards de fois celle du Soleil. Ces objets influencent leur environnement gravitationnel et participent à l’évolution des galaxies. La formation précise des trous noirs supermassifs reste encore une question scientifique importante. Ce texte est enregistré comme contenu fourni manuellement : Maketik ne doit jamais le présenter comme une transcription récupérée automatiquement.`;
          fs.writeFileSync('/tmp/generation-request.json',JSON.stringify({
            projectName:'CI factual manual fallback',
            universe:'Oiseau enquêteur',
            character:'Bec',
            references:[],
            transcript:manualText,
            transcriptProvenance:{provider:'manual',sourceUrl:inspection.url}
          }));
          console.log(`MANUAL_FALLBACK_TEXT_OK source=${inspection.title}`);
          NODE
      - name: Generate bounded local drafts from manual factual text
        run: |
          STATUS=$(curl --silent --show-error \
            -o /tmp/generation.json \
            -w '%{http_code}' \
            -X POST http://127.0.0.1:3000/api/generate-scripts \
            -H 'content-type: application/json' \
            --data-binary @/tmp/generation-request.json)
          STATUS="$STATUS" node - <<'NODE'
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync('/tmp/generation.json','utf8'));
          const status=Number(process.env.STATUS);
          if(status!==200||!data.ok) throw new Error(`Local generation failed with HTTP ${status}: ${data.error||'unknown error'}`);
          if(data.generationMode!=='fallback'||data.provider!=='local-extractive') throw new Error('Local generation must be explicitly labelled as fallback/extractive');
          if(!Array.isArray(data.scripts)||data.scripts.length<3) throw new Error('Expected at least three real draft artifacts');
          for(const script of data.scripts){
            if(!script.script||!script.hook||!Array.isArray(script.sourceFacts)||script.sourceFacts.length<6) throw new Error('Draft is missing content or source traceability');
            if(script.estimatedSeconds<35||script.estimatedSeconds>75) throw new Error(`Draft duration outside bounded fallback range: ${script.estimatedSeconds}s`);
            for(const fact of script.sourceFacts){
              if(fact.split(/\s+/).filter(Boolean).length>28) throw new Error('A source fact chunk is too large to be a usable traceability unit');
            }
          }
          if(!data.limitations||data.originality!=='extractive-draft') throw new Error('Fallback limitations/originality must be explicit');
          console.log(`LOCAL_DRAFTS_OK count=${data.scripts.length} model=${data.model}`);
          NODE
      - name: Show server log on failure
        if: failure()
        run: cat /tmp/maketik.log || true
